name: Shell syntax
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(find . \
            -path './.git' -prune -o \
            -path './out' -prune -o \
            -path './work*' -prune -o \
            -type f \( -name '*.sh' -o -name 'build.sh' \) -print0)
          if ((${#scripts[@]})); then
            for script in "${scripts[@]}"; do
              bash -n "$script"
            done
          else
            echo 'No shell scripts found; nothing to parse.'
          fi
